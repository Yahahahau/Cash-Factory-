<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10131f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>PIXEL COIN PUSHER</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%2310131f'/%3E%3Crect x='1' y='1' width='6' height='6' fill='%23ffb02e'/%3E%3Crect x='3' y='2' width='2' height='4' fill='%23ff7a1a'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <div id="stage">
      <div id="scene">
        <canvas id="c"></canvas>
        <div id="labels"></div>
        <div id="floats"></div>
        <div id="hud">
          <button id="menuBtn" class="round-btn" aria-label="เมนู"><i></i><i></i><i></i></button>
          <div class="stage-box">
            <div class="stage-title" id="stageTitle">ด่าน 1</div>
            <div class="pbar"><i id="pFill"></i><span id="pText">0 / 50</span></div>
          </div>
          <div class="cash-col">
            <div class="cash-box"><span class="cur">$</span><b id="cash">10</b></div>
            <div class="gem-box"><span class="gem"></span><b id="gems">0</b></div>
            <div class="combo" id="combo"></div>
          </div>
        </div>
        <div id="rightcol">
          <button id="padCap" class="pad" data-key="capacity"><span class="pad-ico cap"></span><span class="pad-name">ความจุ</span><b class="pad-price">$40</b><em class="pad-lv"></em></button>
          <button id="padRare" class="pad" data-key="rare"><span class="pad-ico rare"></span><span class="pad-name">หายาก</span><b class="pad-price">$80</b><em class="pad-lv"></em></button>
          <button id="assist" class="shake"><span class="sh-ico"></span><span class="sh-txt">ช่วยดันเหรียญ</span><i class="sh-cd"></i></button>
        </div>
        <button id="dropBtn" class="drop" aria-label="ปล่อยเหรียญ"><i class="fill" id="dropFill"></i><b id="charges">3</b><span class="drop-lbl">ปล่อย</span></button>
        <div id="ratePanel" class="rate">
          <div class="rate-top"><span class="rate-title">เหรียญ/วิ</span><span class="rate-info" id="rateInfo">0.5/วิ</span></div>
          <button id="rateBtn" class="rate-btn"><span class="cur">$</span><b id="ratePrice">3</b></button>
          <em class="lv-badge" id="rateLv">0</em>
        </div>
        <div id="sheet" class="hidden"></div>
        <div id="flash"></div>
        <div id="banner"><div class="b-small" id="bannerSmall">ผ่านด่านแล้ว!</div><div class="b-big" id="bannerTitle"></div><div class="b-sub" id="bannerSub"></div></div>
        <div id="toast"></div>
      </div>
      <div id="modal" class="hidden"></div>
      <div id="loading"><div class="ld-title">PIXEL<br />COIN PUSHER</div><div class="ld-bar"><i></i></div><div class="ld-sub">กำลังโหลด…</div></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
