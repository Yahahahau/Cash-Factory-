<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#245edb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>PIXEL COIN PUSHER</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%2310131f'/%3E%3Crect x='1' y='1' width='6' height='6' fill='%23ffb02e'/%3E%3Crect x='3' y='2' width='2' height='4' fill='%23ff7a1a'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <div id="work">
      <div id="appwin">
        <div id="appbar" class="xp-title"><span class="wi" data-ico="coin"></span><span class="xp-ttl">Pixel Coin Pusher</span><span class="xp-ctl"><button class="xp-max" id="appMax" aria-label="Maximize" title="Maximize"></button></span></div>
        <div id="appbody">
      <div id="stage">
        <div id="scene">
          <canvas id="c"></canvas>
          <div id="labels"></div>
          <div id="floats"></div>
          <div id="hud">
            <div class="hudtop">
              <section class="hudwin hud-stage" aria-label="Stage">
                <div class="ht"><span id="stageTitle">Stage 1</span></div>
                <div class="hb">
                  <div class="xpprog" id="pBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="pFill"></i><span id="pText">0 / 50</span></div>
                  <div class="line"><span id="runChip">Run 1</span><span>Profit <b id="profitMult">x1.00</b></span></div>
                  <div class="line boostline hidden" id="boostChip" role="button" tabindex="0"></div>
                  <div class="line"><span id="combo"></span></div>
                </div>
              </section>
              <section class="hudwin hud-wallet" aria-label="Wallet">
                <div class="ht"><span>Wallet</span></div>
                <div class="hb">
                  <div class="wrow cash" id="cashRow"><span class="wi" data-ico="coin"></span><b id="cash">10</b></div>
                  <div class="wrow" id="gemRow"><span class="wi" data-ico="gem"></span><b id="gems">0</b></div>
                </div>
              </section>
            </div>
            <button id="runBtn" class="xpbtn green hidden" aria-label="Start a new run"><span>New Run</span></button>
            <div id="rightcol">
              <button id="padCap" class="xpbtn pad" data-key="capacity"><span class="pad-name">Capacity</span><b class="pad-price">$40</b><em class="pad-lv"></em></button>
              <button id="padRare" class="xpbtn pad" data-key="rare"><span class="pad-name">Rare</span><b class="pad-price">$80</b><em class="pad-lv"></em></button>
            </div>
            <div class="hudbot">
              <button id="miniBtn" class="xpbtn" aria-label="Flying Ball"><canvas id="miniIco" width="20" height="16"></canvas><span class="mt"><span id="miniTxt">Play</span><small id="miniSub">Flying Ball</small></span><i class="nd"></i></button>
              <section class="hudwin rate" id="ratePanel" aria-label="Coin rate">
                <div class="ht"><span>Coins/s</span><span style="margin-left:auto" id="rateLv">Lv.0</span></div>
                <div class="hb"><div class="rrow"><span>Rate</span><b id="rateInfo">0.5/s</b></div><button id="rateBtn" class="xpbtn"><span>Upgrade</span><b id="ratePrice" class="pad-price">$3</b></button></div>
              </section>
              <button id="dropBtn" class="xpbtn" aria-label="Drop coins"><span class="dtop"><span class="wi" data-ico="drop"></span><span>Drop</span><b id="charges">3</b></span><span class="xpprog thin"><i id="dropFill"></i></span></button>
            </div>
          </div>
          <div id="flash"></div>
        </div>
      </div>
      <div id="loading"><div class="ld-title"><small>Pixel</small>COIN PUSHER</div><div class="xpprog indet"><i></i></div><div class="ld-sub">Loading...</div></div>
        </div>
      </div>
      <div id="winlayer" class="deskrect" aria-label="Application windows"></div>
      <div id="minilayer" class="deskrect" aria-label="Mini-game application"></div>
      <div id="notifs" class="deskrect" aria-live="polite"></div>
    </div>
    <div id="taskbar">
      <button id="startBtn" aria-haspopup="menu"><span class="wi" data-ico="coin"></span>start</button>
      <div id="tasks"></div>
      <div id="cursorBox"><button id="cursorBtn" aria-label="Cursor Auto Push Coin"><canvas class="cur-ico" id="cursorIco" width="12" height="22"></canvas><span class="cur-txt" id="cursorTxt">$500</span><i class="cur-dot"></i></button><button id="cursorTog" class="hidden" aria-label="Toggle Cursor Auto Push Coin">ON</button></div>
      <div id="tray"><button id="boostTray" class="hidden" aria-label="Profit boost"><span class="wi" data-ico="boost"></span><span id="trayTxt"></span></button><span id="clock">12:00</span></div>
    </div>
  </div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
