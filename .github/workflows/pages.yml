name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # GITHUB_SHA becomes the build id written to version.json -> running iframes auto-update
      - run: npm run build
        # public client config only (repository Settings > Secrets and variables > Actions > Variables). Never put a service_role key here.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_GAME_ID: ${{ vars.VITE_GAME_ID }}
          VITE_AUTH_PROVIDERS: ${{ vars.VITE_AUTH_PROVIDERS }}
          VITE_ENABLE_LINKING: ${{ vars.VITE_ENABLE_LINKING }}
          VITE_TRUSTED_HOST_ORIGINS: ${{ vars.VITE_TRUSTED_HOST_ORIGINS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
